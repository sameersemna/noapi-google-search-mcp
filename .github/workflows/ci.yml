name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Offline test suite ──────────────────────────────────────────────────
  # The suite is entirely offline (live/network tests are opt-in via
  # `-m live`), so no Playwright browser download is needed here.
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
          - python-version: "3.11"
          - python-version: "3.12"
          # 3.13 is newer than some optional native deps (onnxruntime,
          # ctranslate2) have wheels for; treat it as experimental until the
          # ecosystem catches up.
          - python-version: "3.13"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline tests with coverage (core)
        if: matrix.python-version == '3.11'
        run: pytest -m "not live" -q --cov=google_search_mcp.core --cov-report=term --cov-fail-under=80

      - name: Run offline tests
        if: matrix.python-version != '3.11'
        run: pytest -m "not live" -q

  # ── macOS smoke job ────────────────────────────────────────────────────
  test-macos:
    name: tests (macOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run offline tests
        run: pytest -m "not live" -q

  # ── Lint ───────────────────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"

      # Blocking: the modules hardened in this project are held to the full
      # rule set (E,F,W,I,B,UP,ASYNC,S,SIM per pyproject).
      - name: ruff check (gated modules)
        run: |
          ruff check \
            src/google_search_mcp/core \
            src/google_search_mcp/errors.py \
            src/google_search_mcp/tools/annotations.py \
            src/google_search_mcp/__init__.py \
            src/google_search_mcp/__main__.py

      # Informational while the legacy modules are brought up to standard
      # (ratcheting: move paths into the gated list above as they are cleaned).
      - name: ruff check (whole package, informational)
        continue-on-error: true
        run: ruff check src/google_search_mcp

  # ── Type checking (lenient initially; ratchet up later) ────────────────
  typecheck:
    name: mypy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install "mypy>=1.10"
      - name: Type check src
        run: mypy src/google_search_mcp
