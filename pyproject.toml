[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noapi-google-search-mcp"
version = "0.4.0"
description = "42 tools for Local LLMs — Google Search, live feeds, email, documents, QR codes, Wikipedia, S3 upload, vision, OCR, video transcription with optional GPU delegation. No API key required."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Vincent Kaufmann", email = "vincent@kaufmann.dev" },
]
keywords = ["mcp", "google", "search", "playwright", "llm", "ai", "local-llm", "no-api", "chromium", "lm-studio", "rss", "feeds", "reddit", "hackernews", "youtube", "twitter", "arxiv", "openclaw", "ollama", "email", "imap", "pdf", "ocr", "qr-code", "wikipedia", "minio", "s3", "pastebin", "ffmpeg", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "lingua-language-detector>=2.0.2",
    "opencv-python-headless>=4.8.0",
    "rapidocr-onnxruntime>=1.4.0",
    # The [default] extra pulls in yt-dlp-ejs, which yt-dlp needs to solve
    # YouTube's JavaScript signature challenges. Without it every YouTube
    # download fails with "HTTP Error 403: Forbidden".
    "yt-dlp[default]>=2024.0",
    "faster-whisper>=1.0.0",
]

[project.scripts]
noapi-google-search-mcp = "google_search_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_search_mcp"]

[project.urls]
Homepage = "https://github.com/VincentKaufmann/noapi-google-search-mcp"
Repository = "https://github.com/VincentKaufmann/noapi-google-search-mcp"
Issues = "https://github.com/VincentKaufmann/noapi-google-search-mcp/issues"

# ── development / test tooling (not installed by default) ──
# Install with:  pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "coverage>=7.4",
    "ruff>=0.6",
    "mypy>=1.10",
]

# ── pytest configuration ──
[tool.pytest.ini_options]
# The package lives under src/ (src-layout). Add it to sys.path so tests can
# `import google_search_mcp` without a manual sys.path.insert.
pythonpath = ["src"]
# Only collect pytest-style tests (test_*.py / *_test.py). The legacy
# standalone scripts (test_all.py, test_health.py, etc.) are NOT pytest
# suites — they run via `python test_x.py`. Keep them out of pytest's
# collection to avoid import-time side effects (they launch browsers, etc.).
testpaths = ["tests"]
# Show a bit more detail on failures.
addopts = "-ra"
# Auto-mark async test functions / fixtures (all current tests are sync +
# asyncio.run(), so this is additive and does not change existing results).
asyncio_mode = "auto"
# Global safety net against hung tests. Live tests are opt-in via -m live.
timeout = 300
# Custom markers (register so `-m live` / `-m slow` don't warn, and so the
# offline suite can exclude network/browser tests:  pytest -m "not live").
markers = [
    "live: requires real network access and/or a browser (opt-in; run pytest -m live)",
    "slow: long-running test",
]

# ── ruff configuration ──
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "**/server_selenium.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

# ── mypy configuration (start lenient; ratchet up in later phases) ──
[tool.mypy]
python_version = "3.10"
files = ["src/google_search_mcp"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
no_implicit_optional = false
